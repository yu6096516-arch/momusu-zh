[network]
# 汉化服务监听端口，默认 8080
listen_port = 8080

# 上游 HTTP 代理端口；留空表示直连
upstream_port =

# 上游证书校验：beptard / ACGP 等加速器会用自己的证书替换 TLS，
# 严格校验会报 502 / Certificate verify failed，所以默认放宽。
# 如果你用的是 clash / v2ray 这类不替换证书的普通 HTTP 代理，可改成 false。
upstream_insecure = true

# 开发者调试模式：true 时显示完整网络日志（HTTP 请求、连接信息）。
# 保持 false 时控制台只显示汉化器自身状态；详细日志始终写入 logs\monmusu_cn.log。
debug = false

[browser]
# chrome / edge / custom
type = chrome

# 仅 type=custom 时使用
path =

# 留空使用默认启动参数
# 填写后完整替代默认启动参数
args =
